[package]
name = "quota_core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
secrecy = "0.10"

[dev-dependencies]
tempfile = "3"
